<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ant Fugue: sound check</title>
  <!-- A temporary page for listening to the sound engine against the fake colony before
       Phase 2 wires it into index.html. Open it at /audio/demo.html with the server running. -->
  <script type="importmap">
    {
      "imports": {
        "lil-gui": "../vendor/lil-gui/lil-gui.module.min.js",
        "smplr": "../vendor/smplr/smplr.mjs"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 13px system-ui, sans-serif; overflow: hidden; }
    #controls { position: fixed; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 10px; max-width: 360px; }
    button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid #555; background: #222; color: #eee; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    label { display: flex; gap: 8px; align-items: center; }
    #voices span { display: inline-block; margin-right: 10px; }
    #roll { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 140px; }
    #debug { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <canvas id="debug"></canvas>
  <div id="controls">
    <button id="join">Join (start sound)</button>
    <label>Level <input id="level" type="range" min="0" max="2" step="0.01" value="1"> <span id="levelName">Signals</span></label>
    <div id="voices">no voices yet</div>
    <div id="status">connecting…</div>
  </div>
  <canvas id="roll"></canvas>
  <script type="module" src="./demo.js"></script>
</body>
</html>
