<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ant Fugue</title>
  <!-- Every library is a pinned copy in vendor/ (see vendor/VERSIONS.txt), so the app runs offline. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "lil-gui": "./vendor/lil-gui/lil-gui.module.min.js",
        "smplr": "./vendor/smplr/smplr.mjs"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 13px system-ui, sans-serif; overflow: hidden; }
    /* The 3D view fills the window; touch-action: none lets pointer events drive pan and zoom. */
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
    #debug { display: none; margin: 0 auto; cursor: crosshair; }
    #status { position: fixed; left: 8px; bottom: 8px; padding: 4px 8px; background: #0008; border-radius: 4px; }
    #status[data-connection="disconnected"] { color: #f66; }
    #controls { position: fixed; left: 8px; top: 8px; display: flex; gap: 16px; align-items: flex-start;
                padding: 6px 10px; background: #000a; border-radius: 4px; user-select: none; }
    #controls .control { display: flex; flex-direction: column; gap: 2px; }
    #controls .control.debug { flex-direction: row; align-items: center; gap: 4px; align-self: center; }
    #controls .level input { width: 220px; }
    #controls .tilt input { width: 100px; }
    #controls .ticks { display: flex; justify-content: space-between; font-size: 11px; color: #888; }
    #controls b { color: #eee; font-weight: 600; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="debug"></canvas>
  <div id="controls"></div>
  <div id="status">connecting…</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
